services:
  system-health-check:
    build: .
    restart: unless-stopped
    # Bỏ ports hoàn toàn
    pid: host
    volumes:
      - /:/host:ro
    environment:
      CPU_ALERT: "80"
      RAM_ALERT: "80"
      DISK_ALERT: "85"
      DISK_PATH: "/host"
      API_KEY: ""
    expose:
      - "8000"   # chỉ expose trong Docker network nội bộ
