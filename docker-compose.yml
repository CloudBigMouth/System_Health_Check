services:
  system-health-check:
    build: .
    restart: unless-stopped
    pid: host
    volumes:
      - /:/host:ro
    expose:
      - "8000"
    environment:
      CPU_ALERT: ${CPU_ALERT:-80}
      RAM_ALERT: ${RAM_ALERT:-80}
      DISK_ALERT: ${DISK_ALERT:-80}
      DISK_PATH: ${DISK_PATH:-/host}
      API_KEY: ${API_KEY:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
