services:
  system-health-check:
    build: .
    restart: unless-stopped
    pid: host
    volumes:
      - /:/host:ro
    expose:
      - "8000"
    environment:
      CPU_ALERT:  ${CPU_ALERT:-80}
      RAM_ALERT:  ${RAM_ALERT:-80}
      DISK_ALERT: ${DISK_ALERT:-80}
      SWAP_ALERT: ${SWAP_ALERT:-80}
      DISK_PATH:  ${DISK_PATH:-/host}
      API_KEY:    ${API_KEY:-}
